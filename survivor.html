<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>午夜倖存者 | Survivor</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#0b1622;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
  #app{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% 12%,#2a0f2e 0%,#0b1622 70%)}
  #stage{position:relative;aspect-ratio:16/9;width:min(100vw,177.78vh);max-height:100vh;border-radius:14px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
  canvas{width:100%;height:100%;display:block;touch-action:none}
  #hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none;flex-wrap:wrap}
  .pill{background:rgba(8,10,24,.8);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:800;white-space:nowrap}
  .pill b{color:#ffd166}
  #btns{position:absolute;top:10px;right:10px;display:flex;gap:8px;z-index:6}
  button{cursor:pointer;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:800;font-family:inherit}
  .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
  .btn-warning{background:linear-gradient(180deg,#ffd166,#ff9f1c);color:#3a2200}
  button:hover{filter:brightness(1.1)} button:active{transform:translateY(1px)}
  #panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62);z-index:10}
  #card{background:linear-gradient(180deg,#fffdf4,#ecd9ff);border-radius:18px;padding:26px 38px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:86%;max-height:92%;overflow-y:auto}
  #card h2{font-size:30px;margin-bottom:6px;color:#2a0f2e}
  #card p{font-size:15px;color:#4a3560;margin:4px 0;line-height:1.6}
  #card .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .upbtn{display:block;width:100%;text-align:left;cursor:pointer;border:2px solid #b37aff;border-radius:10px;padding:10px 14px;margin-top:8px;font-size:15px;font-weight:800;font-family:inherit;color:#2a0f2e;background:#fff}
  .upbtn:hover{background:#f3e8ff}
  .upbtn small{display:block;font-weight:400;font-size:12.5px;color:#6b5a80}
  #tip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12.5px;color:#fff;background:rgba(0,0,0,.5);padding:5px 16px;border-radius:999px;z-index:5;white-space:nowrap}
  #home{position:absolute;top:10px;left:10px;z-index:7;margin-top:44px}
  #home a{font-size:12.5px;color:#cfe0ef;text-decoration:none;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:999px}
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <div class="pill">⏱️ <b id="h-time">0:00</b></div>
    <div class="pill">❤️ <b id="h-hp">100</b></div>
    <div class="pill">⭐ Lv.<b id="h-lv">1</b></div>
    <div class="pill">💀 <b id="h-kill">0</b></div>
    <div class="pill">🏆 <b id="h-best">—</b></div>
  </div>
  <div id="btns"><button class="btn-ghost" id="b-pause">⏸ 暫停</button><button class="btn-warning" id="b-restart">↻ 重來</button></div>
  <div id="home"><a href="index.html">◀ 回大廳</a></div>
  <div id="panel"><div id="card"><h2 id="c-title"></h2><p id="c-sub"></p><div id="c-body"></div><div class="row" id="c-row"></div></div></div>
  <div id="tip">⌨️ WASD／方向鍵移動・武器自動攻擊・撿💎升級・手機可左半屏拖曳搖桿</div>
</div></div>
<script>
"use strict";
const W=1280,H=720,WW=2200,WH=1600;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
/* ---------- 音效 ---------- */
let AC=null;
function beep(f,d=.1,type='triangle',v=.06){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
const _last={};
function throttled(k,ms){const n=performance.now();if(n-(_last[k]||0)<ms)return false;_last[k]=n;return true;}
const sfx={shoot:()=>{if(throttled('s',120))beep(700,.06,'sawtooth',.03);},hit:()=>{if(throttled('h',90))beep(200,.07,'square',.05);},gem:()=>{if(throttled('g',70))beep(1100,.06,'sine',.05);},up:()=>{[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle',.08),i*90));},hurt:()=>beep(140,.2,'sawtooth',.09),boss:()=>beep(90,.5,'sawtooth',.1),over:()=>{[400,300,220,150].forEach((f,i)=>setTimeout(()=>beep(f,.25,'sawtooth',.08),i*170));},nova:()=>beep(120,.4,'sawtooth',.1)};
/* ---------- 存檔 ---------- */
const K_TIME='hg-survivor-best',K_KILL='hg-survivor-kills';
let BEST=0;try{BEST=+((localStorage.getItem(K_TIME))||0);}catch(e){}
/* ---------- 狀態 ---------- */
let P,foes,gems,projs,parts,floats,elapsed,spawnT,kills,bossN,gameOver,paused,shake;
function reset(){
  P={x:WW/2,y:WH/2,hp:100,maxHp:100,speed:265,lvl:1,xp:0,xpNext:8,magnet:110,shield:0,inv:2,r:18,
     knife:{dmg:12,rate:1.6,count:1,cd:0,spd:640},orbs:{n:1,dmg:10,radius:90,rot:0,spd:2.6}};
  foes=[];gems=[];projs=[];parts=[];floats=[];
  elapsed=0;spawnT=0;kills=0;bossN=0;gameOver=false;paused=false;shake=0;
  $('panel').style.display='none';syncHud();
}
function syncHud(){
  const m=Math.floor(elapsed/60),s=Math.floor(elapsed%60);
  $('h-time').textContent=m+':'+String(s).padStart(2,'0');
  $('h-hp').textContent=Math.ceil(P.hp)+'/'+P.maxHp+(P.shield?' 🛡️'+P.shield:'');
  $('h-lv').textContent=P.lvl;$('h-kill').textContent=kills;
  $('h-best').textContent=BEST>0?Math.floor(BEST)+'秒':'—';
}
/* ---------- 輸入 ---------- */
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='p'||e.key==='P')togglePause();if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
let joy=null; // {ox,oy,dx,dy}
function evPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],p=evPos(t);joy={ox:p.x,oy:p.y,dx:0,dy:0};},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(!joy)return;const t=e.touches[0],p=evPos(t);let dx=p.x-joy.ox,dy=p.y-joy.oy;const d=Math.hypot(dx,dy);if(d>70){dx*=70/d;dy*=70/d;}joy.dx=dx;joy.dy=dy;},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();joy=null;},{passive:false});
function moveVec(){
  let x=0,y=0;
  if(keys['a']||keys['arrowleft'])x-=1;if(keys['d']||keys['arrowright'])x+=1;
  if(keys['w']||keys['arrowup'])y-=1;if(keys['s']||keys['arrowdown'])y+=1;
  if(joy&&(joy.dx||joy.dy)){x=joy.dx/70;y=joy.dy/70;}
  const d=Math.hypot(x,y);if(d>1){x/=d;y/=d;}
  return{x,y};
}
/* ---------- 敵人 ---------- */
const FOE={
  slime:{hp:22,spd:95, r:16,dmg:10,xp:1, c:'#6fce4e'},
  bat:  {hp:12,spd:165,r:12,dmg:8, xp:1, c:'#b388eb'},
  golem:{hp:90,spd:55, r:24,dmg:18,xp:3, c:'#8d7b68'},
  elite:{hp:220,spd:75,r:30,dmg:25,xp:12,c:'#ff9f1c'},
  boss: {hp:1500,spd:62,r:44,dmg:35,xp:40,c:'#e63946'},
};
function spawnFoe(force){
  if(foes.length>140)return;
  const t=elapsed;
  let type='slime';const r=Math.random();
  if(force)type=force;
  else if(t>150&&r<.12)type='elite';
  else if(t>90&&r<.3)type='golem';
  else if(t>40&&r<.55)type='bat';
  const S=FOE[type],mul=1+t/75;
  const a=Math.random()*Math.PI*2,d=720+Math.random()*260;
  let x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
  x=Math.max(30,Math.min(WW-30,x));y=Math.max(30,Math.min(WH-30,y));
  foes.push({type,x,y,hp:Math.round(S.hp*mul*(type==='boss'?(1+bossN*.8):1)),maxHp:Math.round(S.hp*mul*(type==='boss'?(1+bossN*.8):1)),
    spd:S.spd*(0.9+Math.random()*.2),r:S.r,dmg:S.dmg,xp:S.xp,c:S.c,boss:type==='boss',flash:0,orbCd:0,kx:0,ky:0});
}
function burst(x,y,color,n=10,spd=260){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.4,r:2+Math.random()*3,color});}}
function floatTxt(x,y,txt,color){floats.push({x,y,txt,life:1,color:color||'#fff'});}
function dmgFoe(f,dmg,kx,ky){
  if(f.hp<=0)return;f.hp-=dmg;f.flash=.12;f.kx+=kx||0;f.ky+=ky||0;sfx.hit();
  if(f.hp<=0){
    kills++;burst(f.x,f.y,f.c,14,300);
    const n=f.boss?8:(f.type==='elite'?4:1);
    for(let i=0;i<n;i++)gems.push({x:f.x+(Math.random()-.5)*30,y:f.y+(Math.random()-.5)*30,v:f.xp});
    if(f.boss)floatTxt(f.x,f.y-40,'👑 BOSS 擊破！','#ffd166');
    syncHud();
  }
}
/* ---------- 升級 ---------- */
const UPS=[
  {n:'🔪 飛刀傷害 ＋40%',d:'每把刀更痛',f:()=>P.knife.dmg*=1.4},
  {n:'🔪 飛刀射速 ＋25%',d:'射得更快',f:()=>P.knife.rate*=1.25},
  {n:'🔪 飛刀 ＋1 把',d:'一次多射一把扇形刀',f:()=>P.knife.count++},
  {n:'🔮 環繞法球 ＋1 顆',d:'多一顆護體法球',f:()=>P.orbs.n++},
  {n:'🔮 法球傷害 ＋35%',d:'法球更痛，範圍稍大',f:()=>{P.orbs.dmg*=1.35;P.orbs.radius*=1.08;}},
  {n:'👟 移速 ＋12%',d:'跑給怪追',f:()=>P.speed*=1.12},
  {n:'❤️ 血量上限 ＋20',d:'並立即回復 30',f:()=>{P.maxHp+=20;P.hp=Math.min(P.maxHp,P.hp+30);}},
  {n:'🧲 磁鐵 ＋60%',d:'寶石自動飛過來',f:()=>P.magnet*=1.6},
  {n:'🛡️ 護盾 ＋1',d:'抵擋一次受傷',f:()=>P.shield++},
  {n:'💥 新星衝擊',d:'立刻對全場小怪造成重創',f:()=>{sfx.nova();shake=8;foes.forEach(f=>{if(!f.boss)dmgFoe(f,300,(f.x-P.x)*2,(f.y-P.y)*2);});burst(P.x,P.y,'#c77dff',40,500);}},
];
function levelUp(){
  P.lvl++;P.xp-=P.xpNext;P.xpNext=Math.round(8+P.lvl*4.5);sfx.up();paused=true;
  const pool=[...UPS].sort(()=>Math.random()-.5).slice(0,3);
  $('c-title').textContent='⭐ 升級！Lv.'+P.lvl;
  $('c-sub').textContent='三選一強化（暫停中，怪物不會動）';
  $('c-body').innerHTML=pool.map((u,i)=>`<button class="upbtn" data-i="${UPS.indexOf(u)}">${u.n}<small>${u.d}</small></button>`).join('');
  $('c-row').innerHTML='';
  $('panel').style.display='flex';
  $('c-body').querySelectorAll('.upbtn').forEach(b=>b.onclick=()=>{
    UPS[+b.dataset.i].f();$('panel').style.display='none';paused=false;syncHud();
    if(P.xp>=P.xpNext)levelUp();
  });
}
/* ---------- 主迴圈 ---------- */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(gameOver||paused)return;
  update(dt);draw();
}
function update(dt){
  elapsed+=dt;
  // 移動
  const mv=moveVec();
  P.x=Math.max(P.r,Math.min(WW-P.r,P.x+mv.x*P.speed*dt));
  P.y=Math.max(P.r,Math.min(WH-P.r,P.y+mv.y*P.speed*dt));
  if(P.inv>0)P.inv-=dt;
  // 生成：隨時間加速；每 60 秒一隻 BOSS
  spawnT-=dt;
  const iv=Math.max(.22,.9-elapsed*.004);
  if(spawnT<=0){spawnT=iv;spawnFoe();}
  if(Math.floor(elapsed/60)>bossN){bossN++;spawnFoe('boss');sfx.boss();floatTxt(P.x,P.y-60,'⚠️ BOSS 來襲！','#ff6b6b');}
  // 飛刀
  const K=P.knife;K.cd-=dt;
  let near=null,nd=1e9;
  for(const f of foes){if(f.hp<=0)continue;const d=Math.hypot(f.x-P.x,f.y-P.y);if(d<nd){nd=d;near=f;}}
  if(near&&nd<720&&K.cd<=0){
    K.cd=1/K.rate;const base=Math.atan2(near.y-P.y,near.x-P.x);
    for(let i=0;i<K.count;i++){const a=base+(i-(K.count-1)/2)*.14;
      projs.push({x:P.x,y:P.y,vx:Math.cos(a)*K.spd,vy:Math.sin(a)*K.spd,dmg:K.dmg,life:1.4});}
    sfx.shoot();
  }
  // 飛刀飛行＋命中
  for(const p of projs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    for(const f of foes){if(f.hp<=0||p.life<=0)continue;
      if(Math.hypot(f.x-p.x,f.y-p.y)<f.r+6){dmgFoe(f,p.dmg,p.vx*.15,p.vy*.15);burst(p.x,p.y,'#ffd166',5,200);p.life=0;break;}}}
  projs=projs.filter(p=>p.life>0);
  // 法球
  const O=P.orbs;O.rot+=O.spd*dt;
  for(let i=0;i<O.n;i++){const a=O.rot+i*Math.PI*2/O.n,ox=P.x+Math.cos(a)*O.radius,oy=P.y+Math.sin(a)*O.radius;
    for(const f of foes){if(f.hp<=0||f.orbCd>0)continue;
      if(Math.hypot(f.x-ox,f.y-oy)<f.r+13){f.orbCd=.35;dmgFoe(f,O.dmg,(f.x-P.x)*3,(f.y-P.y)*3);burst(ox,oy,'#c77dff',6,220);}}}
  // 敵人移動＋接觸傷害＋分離
  for(const f of foes){
    if(f.hp<=0)continue;
    if(f.orbCd>0)f.orbCd-=dt;if(f.flash>0)f.flash-=dt;
    const dx=P.x-f.x,dy=P.y-f.y,d=Math.hypot(dx,dy)||1;
    f.x+=(dx/d*f.spd+f.kx)*dt;f.y+=(dy/d*f.spd+f.ky)*dt;
    f.kx*=.86;f.ky*=.86;
    if(d<f.r+P.r&&P.inv<=0){
      if(P.shield>0){P.shield--;P.inv=1;floatTxt(P.x,P.y-30,'🛡️ 格擋！','#7CFFB2');}
      else{P.hp-=f.dmg;P.inv=.6;shake=5;sfx.hurt();burst(P.x,P.y,'#ff6b6b',10,280);
        if(P.hp<=0){P.hp=0;return die();}}
      syncHud();
    }
  }
  // 簡易分離（避免疊成一團）
  for(let i=0;i<foes.length;i++){const a=foes[i];if(a.hp<=0)continue;
    for(let j=i+1;j<foes.length;j++){const b=foes[j];if(b.hp<=0)continue;
      const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;
      if(d2<rr*rr&&d2>0.01){const d=Math.sqrt(d2),push=(rr-d)*.5/d;a.x-=dx*push*.5;a.y-=dy*push*.5;b.x+=dx*push*.5;b.y+=dy*push*.5;}}}
  foes=foes.filter(f=>f.hp>0);
  // 寶石
  for(const g of gems){
    const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;
    if(d<P.magnet){g.x+=dx/d*520*dt;g.y+=dy/d*520*dt;}
    if(d<26){g.got=true;P.xp+=g.v;sfx.gem();burst(P.x,P.y,'#7CFFB2',3,150);}
  }
  gems=gems.filter(g=>!g.got);
  if(P.xp>=P.xpNext)levelUp();
  // 特效
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;q.life-=dt;}
  parts=parts.filter(q=>q.life>0);
  for(const f of floats){f.y-=36*dt;f.life-=dt;}
  floats=floats.filter(f=>f.life>0);
  if(shake>0)shake=Math.max(0,shake-18*dt);
  if(Math.floor(elapsed*2)!==Math.floor((elapsed-dt)*2))syncHud();
}
function die(){
  gameOver=true;sfx.over();
  let nb=false,kb=false;
  try{
    if(elapsed>BEST){BEST=elapsed;localStorage.setItem(K_TIME,String(elapsed));nb=true;}
    const pk=+((localStorage.getItem(K_KILL))||0);
    if(kills>pk){localStorage.setItem(K_KILL,String(kills));kb=true;}
  }catch(e){}
  const m=Math.floor(elapsed/60),s=Math.floor(elapsed%60);
  $('c-title').textContent='💀 你倒在了第 '+m+':'+String(s).padStart(2,'0');
  $('c-sub').innerHTML=`等級 <b>Lv.${P.lvl}</b>・擊殺 <b>${kills}</b> 隻・存活 <b>${m}:${String(s).padStart(2,'0')}</b><br>`+
    (nb?'🏆 <b>新紀錄！最長存活</b><br>':`歷史最佳存活 <b>${Math.floor(BEST/60)}:${String(Math.floor(BEST%60)).padStart(2,'0')}</b><br>`)+
    (kb?'🏆 <b>新紀錄！最多擊殺</b>':'');
  $('c-body').innerHTML='';
  $('c-row').innerHTML=`<button class="btn-warning" id="c-again">↻ 再來一局</button><a href="index.html" style="text-decoration:none"><button class="btn-ghost">◀ 回大廳</button></a>`;
  $('panel').style.display='flex';
  $('c-again').onclick=()=>{reset();};
  syncHud();
}
/* ---------- 繪圖 ---------- */
function draw(){
  const camX=Math.max(0,Math.min(WW-W,P.x-W/2)),camY=Math.max(0,Math.min(WH-H,P.y-H/2));
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  // 地
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#141428');g.addColorStop(1,'#1e0f28');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
  for(let x=-camX%80;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=-camY%80;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.strokeStyle='rgba(255,209,102,.5)';ctx.lineWidth=4;ctx.strokeRect(-camX+6,-camY+6,WW-12,WH-12);
  const sx=x=>x-camX,sy=y=>y-camY;
  // 寶石
  for(const m of gems){ctx.fillStyle='#7CFFB2';ctx.save();ctx.translate(sx(m.x),sy(m.y));ctx.rotate(Math.PI/4);const r=6+Math.min(4,m.v);ctx.fillRect(-r/1.6,-r/1.6,r*1.25,r*1.25);ctx.restore();}
  // 敵人
  for(const f of foes){
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(sx(f.x),sy(f.y)+f.r*.85,f.r*.9,f.r*.32,0,0,7);ctx.fill();
    ctx.fillStyle=f.flash>0?'#ffffff':f.c;ctx.beginPath();ctx.arc(sx(f.x),sy(f.y),f.r,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx(f.x)-f.r*.3,sy(f.y)-f.r*.2,f.r*.28,0,7);ctx.arc(sx(f.x)+f.r*.3,sy(f.y)-f.r*.2,f.r*.28,0,7);ctx.fill();
    ctx.fillStyle='#d00000';ctx.beginPath();ctx.arc(sx(f.x)-f.r*.3,sy(f.y)-f.r*.2,f.r*.13,0,7);ctx.arc(sx(f.x)+f.r*.3,sy(f.y)-f.r*.2,f.r*.13,0,7);ctx.fill();
    if(f.boss){ctx.strokeStyle='#ffd166';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx(f.x),sy(f.y),f.r+5+Math.sin(elapsed*6)*2,0,7);ctx.stroke();}
    if(f.hp<f.maxHp){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(sx(f.x)-f.r,sy(f.y)-f.r-10,f.r*2,5);
      ctx.fillStyle='#ff5b5b';ctx.fillRect(sx(f.x)-f.r,sy(f.y)-f.r-10,f.r*2*Math.max(0,f.hp/f.maxHp),5);}
  }
  // 飛刀
  ctx.strokeStyle='#ffe9a8';ctx.lineWidth=4;ctx.lineCap='round';
  for(const p of projs){ctx.beginPath();ctx.moveTo(sx(p.x)-p.vx*.02,sy(p.y)-p.vy*.02);ctx.lineTo(sx(p.x),sy(p.y));ctx.stroke();}
  // 法球
  const O=P.orbs;
  for(let i=0;i<O.n;i++){const a=O.rot+i*Math.PI*2/O.n,ox=sx(P.x+Math.cos(a)*O.radius),oy=sy(P.y+Math.sin(a)*O.radius);
    const og=ctx.createRadialGradient(ox-3,oy-3,1,ox,oy,13);og.addColorStop(0,'#e0aaff');og.addColorStop(1,'#7b2cbf');
    ctx.fillStyle=og;ctx.beginPath();ctx.arc(ox,oy,12,0,7);ctx.fill();}
  // 玩家
  const px=sx(P.x),py=sy(P.y);
  if(P.inv>0&&Math.floor(elapsed*12)%2===0)ctx.globalAlpha=.45;
  ctx.fillStyle='#4cc9f0';ctx.beginPath();ctx.arc(px,py,P.r,0,7);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#0a3d5c';ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-6,py-3,5,0,7);ctx.arc(px+6,py-3,5,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(px-6,py-3,2.4,0,7);ctx.arc(px+6,py-3,2.4,0,7);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(px,py+6,7,.3,Math.PI-.3);ctx.stroke();
  if(P.shield>0){ctx.strokeStyle='rgba(124,255,178,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,P.r+7,0,7);ctx.stroke();}
  ctx.globalAlpha=1;
  // 血條＋經驗條
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(px-26,py-P.r-16,52,7);
  ctx.fillStyle=P.hp/P.maxHp>.3?'#6fce4e':'#ff5b5b';ctx.fillRect(px-26,py-P.r-16,52*Math.max(0,P.hp/P.maxHp),7);
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(20,H-26,W-40,10);
  ctx.fillStyle='#c77dff';ctx.fillRect(20,H-26,(W-40)*Math.min(1,P.xp/P.xpNext),10);
  // 磁鐵圈（淡）
  ctx.strokeStyle='rgba(124,255,178,.12)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,P.magnet,0,7);ctx.stroke();
  // 粒子＋浮字
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life*2);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(sx(q.x),sy(q.y),q.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.font='bold 20px sans-serif';ctx.textAlign='center';
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.life);ctx.fillStyle=f.color;ctx.fillText(f.txt,sx(f.x),sy(f.y));}
  ctx.globalAlpha=1;
  // 觸控搖桿
  if(joy){ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.ox,joy.oy,60,0,7);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(joy.ox+joy.dx,joy.oy+joy.dy,26,0,7);ctx.fill();}
  ctx.restore();
}
/* ---------- 按鈕 ---------- */
function togglePause(){if(gameOver)return;paused=!paused;$('b-pause').textContent=paused?'▶ 繼續':'⏸ 暫停';}
$('b-pause').onclick=togglePause;
$('b-restart').onclick=()=>reset();
reset();requestAnimationFrame(loop);
</script>
</body>
